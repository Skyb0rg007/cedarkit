[workspace]
resolver = "3"
members = ["crates/cedarkit-core", "crates/cedarkitd", "crates/cedarctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cedarkit-core = { path = "crates/cedarkit-core" }
anyhow = "1"
cedar-policy = { version = "=4.13.0", features = ["tpe"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["user"] }
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
