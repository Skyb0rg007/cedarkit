[workspace]
resolver = "3"
members = [
    "crates/cedarkit-agent",
    "crates/cedarkit-agent-protocol",
    "crates/cedarkit-core",
    "crates/cedarkit-logind",
    "crates/cedarkitd",
    "crates/cedarctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cedarkit-agent-protocol = { path = "crates/cedarkit-agent-protocol" }
cedarkit-core = { path = "crates/cedarkit-core" }
cedarkit-logind = { path = "crates/cedarkit-logind" }
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
zlink = { version = "0.7.1", default-features = false, features = ["proxy", "tracing"] }
zlink-core = { version = "0.7.1", default-features = false, features = ["std", "proxy", "tracing"] }
cedar-policy = "=4.13.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["user"] }
thiserror = "2"
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
