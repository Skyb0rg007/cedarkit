<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install to /usr/share/dbus-1/system.d/, in place of polkit's, to run
     `cedarkitd --polkit` instead of polkitd. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.PolicyKit1"/>
    <!-- cedarkitd calls authentication agents such as GNOME Shell's. -->
    <allow send_interface="org.freedesktop.PolicyKit1.AuthenticationAgent"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.PolicyKit1"/>
  </policy>
</busconfig>
